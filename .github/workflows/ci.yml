name: TeamFlow Production CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test-suite:
    name: Backend Tests & Security Audits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package.json'

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Syntax and lint check
        working-directory: ./backend
        run: node -c src/server.js

      - name: Run complete automated backend test suite
        working-directory: ./backend
        run: npm test

  frontend-build-and-test:
    name: Frontend Tests & Production Vite Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend unit & validation tests
        working-directory: ./frontend
        run: npm test

      - name: Execute Vite production bundle build
        working-directory: ./frontend
        run: npm run build
